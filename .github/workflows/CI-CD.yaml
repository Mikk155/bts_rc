name: Release

on:
  push:
    branches:
      - main
#    paths:
#      - 'scripts/maps/bts_rc/util/utils.as'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Build project
        id: builder
        run: python src/main.py --release -webhook "https://discord.com/api/webhooks/${{ secrets.DISCORD_PUSH_ID }}/${{ secrets.DISCORD_PUSH_TOKEN }}"

      - name: Zip project
        if: steps.builder.outputs.abort == 'false'
        run: zip -r bts_rc.zip scripts/

      - name: Release project
        uses: softprops/action-gh-release@v3
        if: steps.builder.outputs.abort == 'false'
        with:
          files: bts_rc.zip
          body_path: "${{ github.workspace }}/release_notes.md"
          tag_name: ${{ steps.builder.outputs.version }}
          previous_tag: "${{ steps.builder.outputs.previous_version }}"
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
